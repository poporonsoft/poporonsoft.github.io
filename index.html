<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>poporonsoft</title>
  <!-- Kiwi Maru を読み込む（Medium と Regular 想定） -->
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ロゴ -->
  <div class="logo">
    <img src="images/poporonsoft.svg" alt="poporonsoft">
  </div>

  <!-- mini時計 -->
  <div class="app-card">
    <img src="images/minidokei.svg" alt="mini時計" class="app-icon">
    <h2>mini 時計</h2>
    <p>シンプルなアナログ時計。</p>
    <a href="https://apps.apple.com/app/mini%E6%99%82%E8%A8%88/id6737561072">
      <img src="images/Download_on_the_App_Store_Badge_JP_RGB_blk_100317.svg" class="download-btn" alt="App Storeからダウンロード">
    </a>
  </div>

  <!-- ねこ計算ドリル -->
  <div class="app-card">
    <img src="images/nekokeisan.svg" alt="ねこ計算ドリル" class="app-icon">
    <h2>ねこ計算ドリル</h2>
    <p>楽しく計算力アップ！</p>
    <a href="https://apps.apple.com/app/%E3%81%AD%E3%81%93%E8%A8%88%E7%AE%97%E3%83%89%E3%83%AA%E3%83%AB-%E6%9A%97%E7%AE%97%E3%83%88%E3%83%AC%E3%83%BC%E3%83%8B%E3%83%B3%E3%82%B0/id6755174772">
      <img src="images/Download_on_the_App_Store_Badge_JP_RGB_blk_100317.svg" class="download-btn" alt="App Storeからダウンロード">
    </a>
  </div>

  <!-- メール -->
  <div class="contact">
    <img src="images/mail_icon.svg" alt="mail:" class="mail-icon">
    <span>poporonsoft@gmail.com</span>
  </div>

  <!-- フッター -->
  <footer>
    © 2024-2025 Kaori Kurosawa. All rights reserved.
  </footer>

</body>
</html>
